name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shubhjets
          POSTGRES_PASSWORD: shubhjets
          POSTGRES_DB: shubhjets_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shubhjets"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://shubhjets:shubhjets@localhost:5432/shubhjets_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Chromium for the quote PDF tests (same version as playwright-core in apps/api).
      - run: pnpm --filter @shubhjets/api exec playwright-core install --with-deps chromium
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
