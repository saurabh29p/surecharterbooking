name: Film release

# Rebuilds the Vaanika brand film from video/ (deterministic renders + the committed voice, music
# and fonts) and attaches the files to a GitHub release. The large videos never enter git.
# Triggers: push a tag named film-v* (git tag film-v1.1 && git push origin film-v1.1), or change
# video/RELEASE_VERSION on the video-film branch (the release tag is then created by this workflow).
on:
  push:
    tags: ['film-v*']
    branches: [video-film]
    paths: ['video/RELEASE_VERSION']

permissions:
  contents: write

jobs:
  plate:
    name: Render ${{ matrix.job }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: true
      # The 90 fps plates (blended to 30 fps with motion blur in build.sh) are split into frame
      # ranges that render in parallel; build.sh joins them. 3150 frames per plate.
      matrix:
        job: [FilmPlate:0-349, FilmPlate:350-699, FilmPlate:700-1049, FilmPlate:1050-1399, FilmPlate:1400-1749,
              FilmPlate:1750-2099, FilmPlate:2100-2449, FilmPlate:2450-2799, FilmPlate:2800-3149,
              ReelsPlate:0-349, ReelsPlate:350-699, ReelsPlate:700-1049, ReelsPlate:1050-1399, ReelsPlate:1400-1749,
              ReelsPlate:1750-2099, ReelsPlate:2100-2449, ReelsPlate:2450-2799, ReelsPlate:2800-3149,
              HeroLoop:0-479]
    defaults:
      run:
        working-directory: video
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: video/package-lock.json
      - run: npm ci
      - run: npx remotion browser ensure
      - name: Render
        run: |
          COMP="${MATRIX_JOB%%:*}"; RANGE="${MATRIX_JOB##*:}"
          echo "NAME=$COMP-$(printf %04d ${RANGE%%-*})" >> "$GITHUB_ENV"
          node scripts/render.mjs "$COMP" "out/renders/chunks/$COMP-$(printf %04d ${RANGE%%-*}).mov" --frames="$RANGE" --concurrency=2 --profile=standard --img=jpeg
        env:
          MATRIX_JOB: ${{ matrix.job }}
      - uses: actions/upload-artifact@v4
        with:
          name: plate-${{ env.NAME }}
          path: video/out/renders/chunks/${{ env.NAME }}.mov
          retention-days: 3
          compression-level: 0

  release:
    name: Build and publish
    needs: plate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: video
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: video/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install numpy scipy soundfile pyloudnorm
      - run: npm ci
      - run: npx remotion browser ensure
      - uses: actions/download-artifact@v4
        with:
          pattern: plate-*
          path: video/out/renders/chunks
          merge-multiple: true
      - run: ./scripts/build.sh
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then TAG="$GITHUB_REF_NAME"; else TAG="$(tr -d '[:space:]' < RELEASE_VERSION)"; fi
          gh release create "$TAG" out/release/* --target "$GITHUB_SHA" --title "Vaanika brand film ($TAG)" --notes-file RELEASE_NOTES.md
