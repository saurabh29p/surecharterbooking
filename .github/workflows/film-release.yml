name: Film release

# Rebuilds the Vaanika brand film from video/ (deterministic renders + the committed voice, music
# and fonts) and attaches the files to a GitHub release. The large videos never enter git.
# Triggers: push a tag named film-v* (git tag film-v1.1 && git push origin film-v1.1), or change
# video/RELEASE_VERSION on the video-film branch (the release tag is then created by this workflow).
on:
  push:
    tags: ['film-v*']
    branches: [video-film]
    paths: ['video/RELEASE_VERSION']

permissions:
  contents: write

jobs:
  plate:
    name: Render ${{ matrix.comp }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: true
      matrix:
        comp: [FilmPlate, ReelsPlate, HeroLoop]
    defaults:
      run:
        working-directory: video
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: video/package-lock.json
      - run: npm ci
      - run: npx remotion browser ensure
      - run: node scripts/render.mjs ${{ matrix.comp }} out/renders/${{ matrix.comp }}.mov --concurrency=1
      - uses: actions/upload-artifact@v4
        with:
          name: plate-${{ matrix.comp }}
          path: video/out/renders/${{ matrix.comp }}.mov
          retention-days: 3
          compression-level: 0

  release:
    name: Build and publish
    needs: plate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: video
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: video/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install numpy scipy soundfile pyloudnorm
      - run: npm ci
      - run: npx remotion browser ensure
      - uses: actions/download-artifact@v4
        with:
          pattern: plate-*
          path: video/out/renders
          merge-multiple: true
      - run: ./scripts/build.sh
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then TAG="$GITHUB_REF_NAME"; else TAG="$(tr -d '[:space:]' < RELEASE_VERSION)"; fi
          gh release create "$TAG" out/release/* --target "$GITHUB_SHA" --title "Vaanika brand film ($TAG)" --notes-file RELEASE_NOTES.md
